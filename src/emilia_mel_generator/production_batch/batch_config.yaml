# Emilia数据集批处理配置文件
# 用于配置批处理任务的各种参数

# 数据路径配置
data_paths:
  # Emilia数据集根目录
  input_data_root: "/path/to/emilia/dataset"
  
  # 输出根目录
  output_root: "/path/to/output"
  
  # 临时文件目录
  temp_dir: "/tmp/emilia_processing"
  
  # 缓存目录
  cache_dir: "/path/to/cache"

# 处理配置
processing:
  # 批处理大小
  batch_size: 100
  
  # 检查点保存间隔（批次数）
  checkpoint_interval: 50
  
  # 最大并行工作进程数
  max_workers: 4
  
  # 计算设备
  device: "cuda"
  
  # 是否启用检查点恢复
  resume_from_checkpoint: true
  
  # 是否跳过已存在的输出文件
  skip_existing: true

# 模型配置
models:
  # BigVGAN配置
  bigvgan:
    model_name: "nvidia/bigvgan_v2_24khz_100band_256x"
    sample_rate: 24000
    hop_size: 256
    n_mel_channels: 100
  
  # Vevo TTS配置
  vevo_tts:
    flow_matching_steps: 16
    use_global_guided_inference: false
    auto_download_models: true
  
  # Emotion2Vec配置
  emotion2vec:
    enable: true

# 数据集配置
dataset:
  # 支持的语言
  languages: ["en", "zh"]
  
  # 音频格式
  audio_format: "wav"
  
  # 采样率
  target_sample_rate: 24000
  
  # 最大音频长度（秒）
  max_audio_duration: 30
  
  # 最小音频长度（秒）
  min_audio_duration: 1

# 输出配置
output:
  # 文件格式
  mel_format: "npy"
  emotion_format: "npz"
  audio_format: "wav"
  
  # 压缩选项
  compress_mels: false
  compress_emotions: true
  
  # 验证音频生成
  generate_verification_audio: true

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # 日志文件配置
  file_logging:
    enable: true
    filename: "emilia_batch_processing.log"
    max_size_mb: 100
    backup_count: 5

# 调度配置（用于集群环境）
scheduling:
  # SLURM配置
  slurm:
    partition: "gpu"
    nodes: 1
    ntasks_per_node: 1
    cpus_per_task: 8
    mem: "32G"
    gres: "gpu:1"
    time: "24:00:00"
  
  # 环境配置
  environment:
    conda_env: "marm5"
    python_path: "/path/to/python"
    
# 监控配置
monitoring:
  # 进度报告间隔（样本数）
  progress_report_interval: 100
  
  # 性能监控
  monitor_gpu_usage: true
  monitor_memory_usage: true
  
  # 错误阈值
  max_consecutive_failures: 10
  max_total_failure_rate: 0.1
