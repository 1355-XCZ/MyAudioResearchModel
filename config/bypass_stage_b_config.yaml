# 绕过阶段B的测试配置文件
# 专门用于测试除阶段B外的所有组件

# 实验配置
experiment:
  name: "bypass_stage_b_test"
  output_dir: "outputs/bypass_test"
  
# 数据处理配置: 音频 -> 文本 + 情感特征
data_processing:
  processor_type: "whisper_emotion"
  whisper_config:
    model_size: "base"    # base模型平衡速度和准确性
    language: "zh"        # 中文
    device: "auto"
  emotion_config:
    model_name: "emotion2vec_base"
    feature_dim: 768
    device: "auto"

# 阶段A配置: 音素/文本 -> M0 (中性Mel频谱)
stage_a:
  model_type: "tts_model"              # 通用TTS模型类型
  tts_architecture: "fastspeech2"      # 具体TTS架构: fastspeech2, paddlespeech_fastspeech2
  model_config:
    d_model: 256
    n_layers: 4          # 减少层数以加快测试速度
    n_heads: 8
    dropout: 0.1
  phoneme_vocab:
    source: "pypinyin_auto"    # 自动生成中文音素词汇表

# 阶段B配置 (测试中将被绕过)
stage_b:
  model_type: "two_stage_emotion"
  model_config:
    emotion_dim: 768
    mel_dim: 80
    hidden_dim: 256      # 减少隐藏维度
    n_layers: 2          # 减少层数
    enable_b2: false     # 禁用B2阶段以简化测试
  training:
    batch_size: 8        # 小批量用于测试
    learning_rate: 1e-4
    epochs: 5

# VQ-VAE情感量化器配置 (测试中将被绕过)
emotion_quantizer:
  enabled: false         # 禁用量化器以绕过相关测试
  type: "vqvae"
  input_dim: 768
  embedding_dim: 64
  codebook_sizes: [64, 128, 256]  # 减少码本数量以加快测试
  commitment_loss_weight: 0.25

# 声码器配置: Mel频谱 -> 音频
vocoder:
  model_type: "hifigan_custom"  # 默认使用自定义HiFi-GAN (快速启动)
  model_config:
    sampling_rate: 22050    # 采样率
    hop_length: 256         # 帧移
    win_length: 1024        # 窗长
    n_mel_channels: 80      # Mel通道数

# 测试用的声码器配置选项
test_vocoders:
  # 测试时将尝试这些声码器
  - type: "hifigan_custom"
    description: "自定义HiFi-GAN (轻量级)"
    config:
      model_config: {}
      
  - type: "hifigan_nvidia" 
    description: "NVIDIA预训练HiFi-GAN (高质量)"
    config:
      model_config:
        model_name: "nvidia/tts_hifigan"
        
  - type: "bigvgan_22khz"
    description: "BigVGAN 22kHz (世界级质量)"
    config:
      model_config:
        version: "22khz"

# 数据集路径配置 (测试用)
dataset:
  # 测试数据路径
  test_data:
    audio_dir: "test_data/audio/"
    text_dir: "test_data/text/"
    
  # 如果没有真实数据，将使用合成数据
  use_synthetic_data: true
  
  # 合成数据配置
  synthetic_config:
    sample_rate: 22050
    duration: 3.0        # 3秒测试音频
    frequencies: [440, 523, 659]  # A4, C5, E5音符

# 测试配置
test_config:
  # 测试文本
  test_texts:
    - "你好，这是一个测试句子。"
    - "今天天气很好，适合出门散步。"  
    - "人工智能技术正在快速发展。"
    - "语音合成系统正在进行功能测试。"
    
  # 测试模式
  test_modes:
    - name: "audio_to_stage_a"
      description: "音频输入到阶段A测试"
      enabled: true
      
    - name: "stage_a_to_vocoder"
      description: "阶段A到声码器测试"
      enabled: true
      
    - name: "text_to_audio"
      description: "纯文本到音频测试"
      enabled: true
      
    - name: "vocoder_comparison"
      description: "声码器对比测试"
      enabled: true

# 输出配置
output:
  save_intermediate: true    # 保存中间结果
  save_audio: true          # 保存音频文件
  generate_report: true     # 生成测试报告
  audio_format: "wav"       # 音频格式
  
# 日志配置
logging:
  level: "INFO"
  save_to_file: true
  log_file: "outputs/bypass_test/test.log"
