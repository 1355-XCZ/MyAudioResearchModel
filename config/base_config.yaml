# 情感音频建模完整配置文件
experiment:
  name: "emotion_audio_modeling"  # 实验名称
  output_dir: "outputs"           # 输出目录
  log_level: "INFO"               # 日志级别

# 数据处理配置
data_processing:
  # Whisper语音识别配置
  whisper:
    model_size: "base"  # 模型大小: tiny, base, small, medium, large
    language: "zh"      # 语言设置
  
  # Emotion2Vec情感特征提取配置
  emotion2vec:
    model_path: "iic/emotion2vec_base"  # 官方ModelScope路径
    feature_dim: 768                    # 特征维度
    granularity: "utterance"            # 特征粒度: utterance | frame
    extract_embedding: true             # 是否提取嵌入特征
  
  # 音素转换配置
  phoneme:
    language: "zh"           # 语言
    g2p_model: "pypinyin"    # 音素转换器类型

# VQ-VAE情感量化器配置 (位于B阶段之前，量化情感输入)
emotion_quantizer:
  enabled: true                              # 总开关：是否启用量化实验
  type: "vqvae"                             # 量化器类型: vqvae | identity
  input_dim: 768                            # 输入维度 (emotion2vec特征)
  embedding_dim: 64                         # 量化嵌入维度
  commitment_loss_weight: 0.25              # VQ-VAE承诺损失权重
  codebook_sizes: [64, 128, 256, 512, 1024] # 实验的码本大小列表
  
  # 训练配置（具体参数在实现时确定）
  training:
    enabled: true                          # 是否训练码本

# 阶段A配置: 音素 -> M0 (中性Mel频谱)
stage_a:
  model_type: "fastspeech2"  # TTS模型类型
  model_config:
    d_model: 256    # 模型维度
    n_layers: 6     # Transformer层数
    n_heads: 8      # 注意力头数
    dropout: 0.1    # Dropout率
  
  training:
    batch_size: 32           # 批大小
    learning_rate: 1e-4      # 学习率
    epochs: 100              # 训练轮数
    checkpoint_interval: 10  # 检查点保存间隔

# 阶段B配置: (M0, 情感特征) -> M1/M2
stage_b:
  model_type: "two_stage_emotion"  # 两阶段情感模型
  model_config:
    emotion_dim: 768         # 情感特征维度
    mel_dim: 80              # Mel频谱维度
    hidden_dim: 512          # 隐藏层维度
    n_layers: 4              # 网络层数
    enable_b2: true          # 是否启用B2阶段 (扩散细化)
    diffusion_steps: 20      # B2扩散步数
  
  training:
    batch_size: 16    # 批大小
    learning_rate: 5e-5  # 学习率
    epochs: 50        # 训练轮数

# 声码器配置: Mel频谱 -> 音频
vocoder:
  model_type: "hifigan"  # 声码器类型
  model_config:
    sampling_rate: 22050    # 采样率
    hop_length: 256         # 帧移
    win_length: 1024        # 窗长
    n_mel_channels: 80      # Mel通道数

# 数据集路径配置
dataset:
  # 训练数据路径
  train_data:
    audio_dir: "data/train/audio"     # 训练音频目录
    text_dir: "data/train/text"       # 训练文本目录 (可选)
  
  # 测试数据路径 (推荐使用ESD数据集)
  test_data:
    audio_dir: "data/test/esd/audio"           # 测试音频目录
    text_dir: "data/test/esd/text"             # 测试文本目录
    emotion_labels: "data/test/esd/labels.csv" # 情感标签文件

# 评估和实验配置
evaluation:
  metrics: ["mel_loss", "emotion_similarity", "content_preservation"]  # 评估指标
  save_audio_samples: true   # 是否保存音频样本
  num_test_samples: 100      # 测试样本数量
  
  # VQ-VAE码本实验配置
  vq_vae_experiment:
    enabled: true                    # 是否启用VQ-VAE实验
    test_all_codebook_sizes: true    # 测试所有码本大小
    test_both_stages: true           # 同时测试B1和B2阶段
    save_comparison_report: true     # 保存对比报告