# Base configuration for Emotion RVQ Bottleneck
# This file contains default values for all parameters

# Model Architecture
model:
  grouped_rvq:
    feature_dim: 768
    num_groups: 12
    group_dim: 64
    num_fine_layers: 16
    fine_codebook_size: 128
    enable_skip: true
    decay: 0.99
    commitment_weight: 0.25
    kmeans_init: true
    
  entropy_model:
    d_model: 256
    num_layers: 6
    num_heads: 8
    d_ff: 1024
    dropout: 0.1
    use_amp: true
    use_tf32: true

# Training
training:
  # RVQ Training
  rvq:
    num_epochs: 30
    batch_size: 32
    learning_rate: 1.0e-4
    early_stopping:
      enabled: true
      patience: 10
      min_delta: 0.0001
    
  # Entropy Model Training  
  entropy:
    num_epochs: 5
    batch_size: 16
    learning_rate: 1.0e-4
    early_stopping:
      enabled: true
      patience: 2
      min_delta: 0.01

# Rate Control
rate_control:
  lambda_min: 1.0e-4
  lambda_max: 16.0
  tolerance_bpf: 1.0
  max_iters: 20

# Evaluation
evaluation:
  # Rate sweep (primary method)
  rate_sweep:
    enabled: true
    rates_bpf: [5, 10, 15, 20, 25, 30, 40, 50, 100, 200, inf]
  
  # Layer sweep (secondary method)
  layer_sweep:
    enabled: true
    layers: [12, 24, 36, 48, 60]  # 12 groups × (1,2,3,4,5) layers
  
  # Classifier
  emotion2vec_model: "iic/emotion2vec_plus_base"
  emotion2vec_hub: "ms"

# Paths (use local_config.sh for system-specific paths)
paths:
  checkpoints: "checkpoints"
  results: "evaluation_results"
  cache: "indices_cache"

