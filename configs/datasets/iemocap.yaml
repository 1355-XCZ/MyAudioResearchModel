# IEMOCAP Dataset Configuration
# Extends default.yaml

# Dataset specific settings
dataset:
  name: "IEMOCAP"
  emotions: ["angry", "happy", "neutral", "sad"]  # 4 core emotions
  samples_per_emotion: 100  # for evaluation
  
  # Data paths (overridden by local_config.sh if needed)
  data_root: null  # set in local_config.sh or command line
  features_dir: "IEMOCAP"

# Evaluation specific to IEMOCAP
evaluation:
  rate_sweep:
    # IEMOCAP-specific rate points (if different from default)
    rates_bpf: null  # null means use default

# Training data (if training on IEMOCAP subset)
training:
  # Override if needed
  rvq:
    num_epochs: 20  # Less epochs for smaller dataset

